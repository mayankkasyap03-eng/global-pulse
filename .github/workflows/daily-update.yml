name: Daily Global Pulse Update

on:
  schedule:
    - cron: '0 8 * * *'   # Runs every day at 4:00 AM IST
  workflow_dispatch:      # Allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Last Updated date
        run: |
          sed -i "s/Last Updated: .*/Last Updated: $(date '+ %B %d, %Y')/" README.md
          echo "Updated on $(date)" >> Daily-Brief/latest-log.md

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md Daily-Brief/
          git diff --staged --quiet || git commit -m "chore: daily automated update"
          git push
